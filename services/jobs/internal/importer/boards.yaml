# Companies whose public job boards the importer reads. Only jobs based in Romania, in a domain a person can pick
# (IT, banking, accounting, finance, insurance, HR), are kept. board is the company's name on its platform, as in its board's links:
#   greenhouse        job-boards.greenhouse.io/<board>
#   lever, lever-eu   jobs.lever.co/<board>, jobs.eu.lever.co/<board>
#   ashby             jobs.ashbyhq.com/<board>
#   smartrecruiters   jobs.smartrecruiters.com/<board>
#   workday           <tenant>.wdN.myworkdayjobs.com/<site>, the board being that host and site
#   bamboohr          <board>.bamboohr.com/careers
#   recruitee         <board>.recruitee.com
#   workable          apply.workable.com/<board>
#   anofm             ANOFM's job matching portal (mediere.anofm.ro), a county by its code; each job keeps its own employer
