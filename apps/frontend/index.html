<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- security.csp: nginx writes each response's nonce over the placeholder.
         Vite adds its own csp-nonce meta tag; vaul-vue, behind Nuxt UI's
         drawer, reads the nonce from this one's content attribute. -->
    <meta property="csp-nonce" nonce="__CSP_NONCE__" content="__CSP_NONCE__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>crashr</title>
  </head>
  <body class="bg-default text-default antialiased">
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
