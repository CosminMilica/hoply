server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # security.csp: defence-in-depth headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # security.csp: index.html carries the Content-Security-Policy. Its nonce is
    # $request_id, 16 random bytes per request as hex; sub_filter writes it over
    # the __CSP_NONCE__ placeholder the build stamps on its tags, and the page is
    # never cached, so its nonce always matches its header. A location with its
    # own add_header inherits none from the server, so the headers repeat here.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'strict-dynamic' 'report-sample'; style-src 'self' 'nonce-$request_id' 'report-sample' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-store" always;
        sub_filter_once off;
        sub_filter "__CSP_NONCE__" "$request_id";
    }
}
