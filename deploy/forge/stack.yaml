# The forge stack of hoply. Regenerate with the forge build pinned in .forge/quality.json.
project_name: hoply
description: "Hoply: job search with a CV tailored to each job"
include_keycloak: true
keycloak: { port: 18080, realm: hoply, client_id: hoply-web }
backends:
  # profile owns the person's profile: headline, about, contact, skills, experience, education, languages
  - { name: profile, language: go, go_version: "1.27", app_template: crud-service, features: [profiles], server_port: 5010 }
  # jobs holds the jobs a person finds or adds (from a link or pasted text) and reads their requirements with rules
  - { name: jobs, language: go, go_version: "1.27", app_template: crud-service, features: [jobs], server_port: 5020 }
  # applications tracks what a person does with each job: saved, CV ready, applied, and the jobs they skipped
  - { name: applications, language: go, go_version: "1.27", app_template: crud-service, features: [applications], server_port: 5030 }
  # cv prepares the questions for a job and writes a CV tailored to it from a snapshot of the profile
  - { name: cv, language: go, go_version: "1.27", app_template: crud-service, features: [cvs], depends_on: [profile, jobs], server_port: 5040 }
# The web app on forge's app-shell template: no generated page of its own; hoply's pages are composed into the
# router factory. Every part of the app talks to its own service; MSW is kept for services still being built.
frontend:
  framework: vue
  include_auth: true
  auth: { runtime: forge, session_dialog: project }
  include_chat: false
  layout: sidebar
  package_manager: npm
  server_port: 5173
  dev_server: true
  ui_kit: nuxt-ui
  app_template: app-shell
  extras: [msw, forms, confirm]
  routing: { landing: hoply-profile, sign_in: builtin, auth_stuck: builtin, not_found: builtin, forbidden: builtin }
  layouts:
    app:
      shell: header-sidebar
      menus:
        primary:
          - items:
              - { id: jobs, label: Find jobs, icon: i-lucide-search, to: hoply-jobs }
              - { id: saved, label: Saved, icon: i-lucide-heart, to: hoply-saved, badge: saved }
              - { id: applications, label: Applications, icon: i-lucide-briefcase, to: hoply-applications, badge: applications }
        account:
          - items:
              - { id: profile, label: Your profile, icon: i-lucide-user, to: hoply-profile }
              - { id: skills, label: Skill gaps, icon: i-lucide-target, to: hoply-skills }
          - items:
              - { id: sign-out, label: Sign out, icon: i-lucide-log-out, action: sign-out }
options:
  auth.mode: generate
  auth.provider: gatekeeper
  auth.service_discovery: true
  auth.keycloak_self_registration: own_organization
  database.multitenancy: shared_rls
  database.tenant_resolution: token_claim
  observability.health: true
