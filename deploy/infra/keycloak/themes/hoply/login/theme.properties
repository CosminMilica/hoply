# Hoply's sign-in pages. keycloak.v2's page templates keep the flows, forms and field names; Hoply owns the page frame
# (template.ftl), the copy (messages) and the stylesheet. PatternFly is not loaded: the classes below are the ones
# hoply.css styles.
parent=keycloak.v2
import=common/keycloak
locales=en,ro
darkMode=false

stylesCommon=
styles=css/hoply.css

kcHtmlClass=h-html
kcBodyClass=h-body
kcFormClass=h-form
kcFormGroupClass=h-field
kcFormGroupLabelClass=h-label-row
kcFormLabelClass=h-label
kcFormLabelTextClass=h-label-text
kcLabelClass=h-label
kcLabelWrapperClass=h-label-row
kcContentWrapperClass=h-block
kcInputClass=h-control
kcTextareaClass=h-control
kcInputGroup=h-input-group
kcInputGroupItemClass=h-input-group-item
kcFill=h-fill
kcError=h-invalid
kcFormReadOnlyClass=h-readonly
kcInputRequiredClass=h-required
kcFormHelperTextClass=h-help
kcInputHelperTextClass=h-help-row
kcInputHelperTextItemClass=h-help-item
kcInputHelperTextItemTextClass=h-help-text
kcInputErrorMessageClass=h-error kc-feedback-text
kcFormControlUtilClass=h-control-status
kcInputErrorIconStatusClass=h-control-status
kcInputErrorIconClass=h-i h-i-alert
kcFormPasswordVisibilityButtonClass=h-icon-btn
kcFormPasswordVisibilityIconShow=h-i h-i-eye
kcFormPasswordVisibilityIconHide=h-i h-i-eye-off
kcFormActionGroupClass=h-actions
kcFormSettingClass=h-options
kcFormOptionsClass=h-options
kcFormButtonsClass=h-actions

kcCheckboxClass=h-check
kcCheckboxInputClass=h-check-input
kcCheckboxLabelClass=h-check-label
kcCheckboxLabelRequiredClass=h-required
kcCheckInputClass=h-check-input

kcButtonClass=h-btn
kcButtonPrimaryClass=h-btn h-btn-primary
kcButtonSecondaryClass=h-btn h-btn-secondary
kcButtonDefaultClass=h-btn-secondary
kcButtonBlockClass=h-btn-block
kcButtonLinkClass=h-btn h-btn-link
kcButtonLargeClass=

kcAlertClass=h-alert
kcAlertIconClass=h-alert-icon
kcAlertTitleClass=h-alert-text
kcAlertDescriptionClass=h-alert-text

kcPanelClass=h-block
kcPanelMainClass=h-block
kcPanelMainBodyClass=h-block
kcListClass=h-list
kcFormSocialAccountListClass=h-list
kcFormSocialAccountListItemClass=h-list-item
kcFormSocialAccountListButtonClass=h-btn h-btn-secondary h-btn-block
